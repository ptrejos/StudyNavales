<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12365c"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}[hidden]{display:none!important}</style><title>Balotario ES</title>

<style>
/* Layout: single-column phone app, sticky top bar, bottom tab bar. Palette: chart-room navy, paper, signal red (buoy), brass. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#0e2238; --muted:#5b6f82; --line:#d3dce4;
  --navy:#12365c; --navy-ink:#ffffff; --accent:#c8402a; --accent-ink:#ffffff;
  --ok:#1d7a4c; --ok-bg:#dff3e8; --bad:#b3261e; --bad-bg:#fbe3e0; --brass:#9a7420;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"Public Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1724; --surface:#132336; --ink:#e7eef5; --muted:#92a6b8; --line:#244058;
  --navy:#1d4a78; --navy-ink:#ffffff; --accent:#ec6a50; --accent-ink:#1a0a06;
  --ok:#5fcf92; --ok-bg:#12382a; --bad:#ff8a80; --bad-bg:#4a1c19; --brass:#d9b25c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1724; --surface:#132336; --ink:#e7eef5; --muted:#92a6b8; --line:#244058;
  --navy:#1d4a78; --navy-ink:#ffffff; --accent:#ec6a50; --accent-ink:#1a0a06;
  --ok:#5fcf92; --ok-bg:#12382a; --bad:#ff8a80; --bad-bg:#4a1c19; --brass:#d9b25c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 84px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.wrap{max-width:560px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:32px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
header h1{font-size:22px;flex:1;min-width:0}
header .sub{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;opacity:.8;text-transform:uppercase}
h2{font-size:20px;color:var(--navy)} :root[data-theme="dark"] h2{color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--ink)}}
.label{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
section.screen{display:flex;flex-direction:column;gap:18px;padding-block:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.chip small{opacity:.7;margin-left:4px}
.btn{border:0;border-radius:8px;padding:14px 18px;min-height:48px;font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 6px;min-height:44px;font-weight:500;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}
.hero{background:var(--navy);color:var(--navy-ink);border-radius:10px;padding:16px;display:flex;gap:14px;align-items:center}
.hero .big{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.hero p{margin:0;opacity:.85;font-size:14px}
.group{display:flex;flex-direction:column;gap:8px}
/* quiz */
.qbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tag{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.qtext{font-size:18px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:52px}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px;background:var(--bg);border:1px solid var(--line)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:3px}
.opt.sel{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.opt.sel .l{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)} .opt.ok .l{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)} .opt.bad .l{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.fb{border-radius:10px;padding:12px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.fb b{font-family:var(--f-display);font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.fb.ok b{color:var(--ok)} .fb.bad b{color:var(--bad)}
.src{color:var(--muted);font-size:13px;margin-top:6px;overflow-wrap:anywhere}
.fixedbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.fixedbar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.iconbtn{border:0;background:transparent;color:inherit;width:44px;height:44px;border-radius:8px;font-size:22px;display:grid;place-items:center}
.star[aria-pressed="true"]{color:var(--brass)}
.timer{font-family:var(--f-display);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 9px;display:flex;flex-direction:column;gap:2px;align-items:center;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* results */
.score{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats3 div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 4px}
.stats3 b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.1}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:var(--ok)} .bar .r{background:var(--bad)}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.item .qq{font-weight:600;overflow-wrap:anywhere}
.item .ans{margin-top:6px;font-size:14px}
.item .ans .ok{color:var(--ok);font-weight:600} .item .ans .bad{color:var(--bad)}
input[type=search]{width:100%;font:inherit;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);min-height:46px}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function chrome(show){
  $("#chrome").innerHTML=show?`<nav class="tabs"><div class="in">
   ${[["home","Inicio",'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],["study","Estudiar",'<path d="M4 5h7a3 3 0 013 3v12a2 2 0 00-2-2H4zM20 5h-7a3 3 0 00-3 3"/><path d="M20 5v13h-6"/>'],["prog","Progreso",'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>']]
     .map(([k,n,p])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24">${p}</svg>${n}</button>`).join("")}
   </div></nav>`:"";
  if(show)document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;view=tab;render();scrollTo(0,0)});
}
function render(){
  ({home:rHome,study:rStudy,prog:rProg,quiz:rQuiz,result:rResult})[view]();
}
function head(t,s){$("#ttl").textContent=t;$("#hsub").textContent=s||""}

/* HOME */
function rHome(){
  head("Balotario ES","Admisión 2026-II");
  const n=pool().length, total=Q.length, seen=Object.keys(stats).length;
  const ok=Object.values(stats).filter(s=>s.l).length;
  const cnt=Math.min(cfg.count||n,n);
  $("#app").innerHTML=`<section class="screen">
   <div class="hero"><div class="big">${total}</div><p>preguntas en 5 áreas.<br>Has visto ${seen} y dominas ${ok}.</p></div>
   <div class="group"><span class="label">Áreas</span><div class="chips" id="cArea">
     ${AREAS.map(([k,v])=>`<button class="chip" data-v="${k}" aria-pressed="${cfg.areas.includes(k)}">${v}<small>${Q.filter(q=>q.a===k).length}</small></button>`).join("")}
   </div><span class="small muted">Sin selección se incluyen todas.</span></div>
   <div class="group"><span class="label">Dificultad</span><div class="chips" id="cDiff">
     ${DIFF.map(([k,v])=>`<button class="chip" data-v="${k}" aria-pressed="${cfg.diff.includes(k)}">${v}</button>`).join("")}</div></div>
   <div class="group"><span class="label">Preguntas</span><div class="seg" id="sPool">
     ${[["todas","Todas"],["nuevas","Nuevas"],["falladas","Falladas"],["favs","Favoritas"]].map(([k,v])=>`<button data-v="${k}" aria-pressed="${cfg.pool===k}">${v}</button>`).join("")}</div></div>
   <div class="group"><span class="label">Modo</span><div class="seg" id="sMode">
     <button data-v="practica" aria-pressed="${cfg.mode==='practica'}">Práctica</button>
     <button data-v="simulacro" aria-pressed="${cfg.mode==='simulacro'}">Simulacro</button></div>
     <span class="small muted">${cfg.mode==='practica'?'Ves si acertaste y la fuente después de cada respuesta.':'Corrige al final, como en el examen. Puedes cambiar respuestas.'}</span></div>
   <div class="row"><div class="group grow"><span class="label">Cantidad</span><div class="seg" id="sCount">
     ${[10,20,40,0].map(c=>`<button data-v="${c}" aria-pressed="${cfg.count===c}">${c||'Todas'}</button>`).join("")}</div></div></div>
   <div class="group"><span class="label">Orden</span><div class="seg" id="sOrder">
     <button data-v="random" aria-pressed="${cfg.order==='random'}">Aleatorio</button>
     <button data-v="seq" aria-pressed="${cfg.order==='seq'}">Secuencial</button></div></div>
   <button class="btn" id="go" ${n?'':'disabled'}>${n?`Comenzar · ${cnt} preguntas`:'Sin preguntas con este filtro'}</button>
  </section>`;
  chrome(true);
  const tog=(id,key)=>document.querySelectorAll(id+" .chip").forEach(b=>b.onclick=()=>{const v=b.dataset.v,a=cfg[key];cfg[key]=a.includes(v)?a.filter(x=>x!==v):a.concat(v);save("cfg",cfg);rHome()});
  tog("#cArea","areas");tog("#cDiff","diff");
  const seg=(id,key,num)=>document.querySelectorAll(id+" button").forEach(b=>b.onclick=()=>{cfg[key]=num?+b.dataset.v:b.dataset.v;save("cfg",cfg);rHome()});
  seg("#sPool","pool");seg("#sMode","mode");seg("#sCount","count",1);seg("#sOrder","order");
  $("#go").onclick=()=>start(cfg.mode,pool());
}

/* QUIZ */
function start(mode,list,seq){
  let ids=list.map(q=>q.id);
  if(!seq&&cfg.order==="random")ids=shuffle(ids);
  else if(!seq)ids=list.slice().sort((a,b)=>AREAS.findIndex(x=>x[0]===a.a)-AREAS.findIndex(x=>x[0]===b.a)||a.n-b.n).map(q=>q.id);
  if(cfg.count&&!seq)ids=ids.slice(0,cfg.count);
  S={mode,ids,i:0,ans:{},t0:Date.now(),done:false,confirmExit:false};
  view="quiz";render();scrollTo(0,0);
}
let tmr=null;
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function rQuiz(){
  chrome(false);
  const id=S.ids[S.i], q=byId[id], a=S.ans[id], prac=S.mode==="practica", shown=prac&&a!==undefined;
  head(prac?"Práctica":"Simulacro","");
  const last=S.i===S.ids.length-1;
  $("#app").innerHTML=`<section class="screen">
   <div class="qbar"><i style="width:${(S.i+(shown?1:0))/S.ids.length*100}%"></i></div>
   <div class="qmeta"><span class="tag">${S.i+1} / ${S.ids.length}</span><span class="tag">${AN[q.a]} · ${q.d==='FACIL'?'Fácil':q.d==='INTERMEDIO'?'Intermedio':'Difícil'}</span>
     <span class="timer" id="tm">${fmt(Date.now()-S.t0)}</span>
     <button class="iconbtn star" id="fav" aria-pressed="${favs.includes(id)}" aria-label="Marcar favorita">${favs.includes(id)?'★':'☆'}</button></div>
   <div class="qtext">${esc(q.q)}</div>
   <div class="opts">${q.o.map((t,k)=>{if(!t)return"";
     let c="opt";if(shown){if(k===q.r)c+=" ok";else if(k===a)c+=" bad"}else if(a===k)c+=" sel";
     return`<button class="${c}" data-k="${k}" ${shown?'disabled':''}><span class="l">${L[k]}</span><span class="t">${esc(t)}</span></button>`}).join("")}</div>
   ${shown?`<div class="fb ${a===q.r?'ok':'bad'}"><b>${a===q.r?'Correcto':'Incorrecto'}</b> · respuesta ${L[q.r]}
     ${q.f?`<div class="src">Fuente: ${esc(q.f)}</div>`:''}</div>`:''}
  </section>
  <div class="fixedbar"><div class="in">
    ${S.confirmExit?`<button class="btn sec" id="stay">Seguir</button><button class="btn" id="quit">Terminar y ver resultado</button>`:
     `<button class="btn sec" id="exit" style="width:auto;padding-inline:16px" aria-label="Salir">Salir</button>
      ${!prac&&S.i>0?'<button class="btn sec" id="prev" style="width:auto;padding-inline:16px">←</button>':''}
      <button class="btn" id="next" ${prac&&!shown?'disabled':''}>${last?'Finalizar':'Siguiente'}</button>`}
  </div></div>`;
  clearInterval(tmr);tmr=setInterval(()=>{const e=$("#tm");if(e)e.textContent=fmt(Date.now()-S.t0)},1000);
  $("#fav").onclick=()=>{favs=favs.includes(id)?favs.filter(x=>x!==id):favs.concat(id);save("favs",favs);rQuiz()};
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k;
    if(prac){if(S.ans[id]!==undefined)return;S.ans[id]=k;record(id,k===q.r)}
    else S.ans[id]=k;
    rQuiz();
    if(prac)scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  });
  const nx=$("#next");if(nx)nx.onclick=()=>{if(last)finish();else{S.i++;rQuiz();scrollTo(0,0)}};
  const pv=$("#prev");if(pv)pv.onclick=()=>{S.i--;rQuiz();scrollTo(0,0)};
  const ex=$("#exit");if(ex)ex.onclick=()=>{S.confirmExit=true;rQuiz()};
  const st=$("#stay");if(st)st.onclick=()=>{S.confirmExit=false;rQuiz()};
  const qt=$("#quit");if(qt)qt.onclick=()=>finish();
}
function record(id,ok){const s=stats[id]||{c:0,w:0};ok?s.c++:s.w++;s.l=ok;stats[id]=s;save("stats",stats)}
function finish(){
  clearInterval(tmr);
  if(S.mode==="simulacro")S.ids.forEach(id=>{if(S.ans[id]!==undefined)record(id,S.ans[id]===byId[id].r)});
  S.ms=Date.now()-S.t0;
  const ok=S.ids.filter(id=>S.ans[id]===byId[id].r).length;
  hist.unshift({t:Date.now(),mode:S.mode,n:S.ids.length,ok,ms:S.ms});hist=hist.slice(0,30);save("hist",hist);
  view="result";render();scrollTo(0,0);
}
function rResult(){
  chrome(false);head("Resultado","");
  const tot=S.ids.length, ok=S.ids.filter(id=>S.ans[id]===byId[id].r).length;
  const blank=S.ids.filter(id=>S.ans[id]===undefined).length, bad=tot-ok-blank, pct=Math.round(ok/tot*100);
  const wrong=S.ids.filter(id=>S.ans[id]!==byId[id].r);
  const per=AREAS.map(([k,v])=>{const ids=S.ids.filter(id=>byId[id].a===k);if(!ids.length)return"";const o=ids.filter(id=>S.ans[id]===byId[id].r).length;
    return`<div class="group"><div class="row"><span class="grow">${v}</span><b>${o}/${ids.length}</b></div><div class="bar"><i class="g" style="width:${o/ids.length*100}%"></i><i class="r" style="width:${(ids.length-o)/ids.length*100}%"></i></div></div>`}).join("");
  $("#app").innerHTML=`<section class="screen">
   <div class="card" style="text-align:center"><div class="score">${pct}%</div><div class="muted">${ok} de ${tot} · ${fmt(S.ms)}</div></div>
   <div class="stats3"><div><b style="color:var(--ok)">${ok}</b><span class="small muted">Correctas</span></div><div><b style="color:var(--bad)">${bad}</b><span class="small muted">Incorrectas</span></div><div><b>${blank}</b><span class="small muted">Sin responder</span></div></div>
   <div class="card list" style="gap:14px"><span class="label">Por área</span>${per}</div>
   ${wrong.length?`<div class="group"><span class="label">Para repasar (${wrong.length})</span><div class="list">${wrong.map(id=>itemHTML(byId[id],S.ans[id])).join("")}</div></div>`:'<div class="empty">Sin errores. Buen trabajo.</div>'}
   <div class="group">${wrong.length?'<button class="btn" id="redo">Repetir las falladas</button>':''}<button class="btn sec" id="home">Volver al inicio</button></div>
  </section>`;
  const r=$("#redo");if(r)r.onclick=()=>start(S.mode,wrong.map(id=>byId[id]),true);
  $("#home").onclick=()=>{tab="home";view="home";render();scrollTo(0,0)};
  bindItems();
}
function itemHTML(q,picked){
  return`<div class="item"><div class="row" style="align-items:flex-start"><div class="qq grow">${esc(q.q)}</div>
   <button class="iconbtn star" data-fav="${q.id}" aria-pressed="${favs.includes(q.id)}" aria-label="Favorita" style="width:36px;height:36px">${favs.includes(q.id)?'★':'☆'}</button></div>
   <div class="ans">${picked!==undefined?`<div class="bad">Tu respuesta: ${L[picked]}. ${esc(q.o[picked])}</div>`:''}<div class="ok">Correcta: ${L[q.r]}. ${esc(q.o[q.r])}</div></div>
   ${q.f?`<div class="src">Fuente: ${esc(q.f)}</div>`:''}</div>`;
}
function bindItems(){document.querySelectorAll("[data-fav]").forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):favs.concat(id);save("favs",favs);const on=favs.includes(id);b.setAttribute("aria-pressed",on);b.textContent=on?"★":"☆"})}

/* STUDY */
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
function rStudy(){
  head("Estudiar","");chrome(true);
  $("#app").innerHTML=`<section class="screen">
   <input type="search" id="sq" placeholder="Buscar en preguntas y respuestas" value="${esc(studyQ)}" autocomplete="off">
   <div class="chips"><button class="chip" data-a="" aria-pressed="${!studyArea&&!studyFav}">Todas</button>
    ${AREAS.map(([k,v])=>`<button class="chip" data-a="${k}" aria-pressed="${studyArea===k}">${v}</button>`).join("")}
    <button class="chip" id="fv" aria-pressed="${studyFav}">★ Favoritas</button></div>
   <div class="list" id="lst"></div></section>`;
  const draw=()=>{
    const t=norm(studyQ);
    const r=Q.filter(q=>(!studyArea||q.a===studyArea)&&(!studyFav||favs.includes(q.id))&&(!t||norm(q.q+" "+q.o.join(" ")).includes(t)));
    const shown=r.slice(0,60);
    $("#lst").innerHTML=(r.length?`<span class="small muted">${r.length} resultados${r.length>60?' (primeros 60)':''}</span>`:'<div class="empty">No hay preguntas con ese filtro.</div>')+shown.map(q=>itemHTML(q)).join("");
    bindItems();
  };
  draw();
  $("#sq").oninput=e=>{studyQ=e.target.value;draw()};
  document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{studyArea=b.dataset.a;studyFav=false;rStudy()});
  $("#fv").onclick=()=>{studyFav=!studyFav;if(studyFav)studyArea="";rStudy()};
}

/* PROGRESS */
let confirmReset=false;
function rProg(){
  head("Progreso","");chrome(true);
  const seen=Object.keys(stats).length, mastered=Object.values(stats).filter(s=>s.l).length;
  const c=Object.values(stats).reduce((a,s)=>a+s.c,0), w=Object.values(stats).reduce((a,s)=>a+s.w,0);
  const acc=c+w?Math.round(c/(c+w)*100):0;
  const rows=AREAS.map(([k,v])=>{const qs=Q.filter(q=>q.a===k),m=qs.filter(q=>stats[q.id]&&stats[q.id].l).length,x=qs.filter(q=>stats[q.id]&&stats[q.id].l===false).length;
    return`<div class="group"><div class="row"><span class="grow">${v}</span><span class="small muted">${m} dominadas · ${x} falladas · ${qs.length}</span></div>
     <div class="bar"><i class="g" style="width:${m/qs.length*100}%"></i><i class="r" style="width:${x/qs.length*100}%"></i></div></div>`}).join("");
  $("#app").innerHTML=`<section class="screen">
   <div class="stats3"><div><b>${seen}</b><span class="small muted">Vistas</span></div><div><b>${mastered}</b><span class="small muted">Dominadas</span></div><div><b>${acc}%</b><span class="small muted">Aciertos</span></div></div>
   <div class="card list" style="gap:14px"><span class="label">Por área</span>${rows}</div>
   <div class="group"><span class="label">Últimas sesiones</span>
    ${hist.length?`<div class="list">${hist.slice(0,8).map(h=>`<div class="item row"><div class="grow"><b>${h.mode==='practica'?'Práctica':'Simulacro'}</b><div class="small muted">${new Date(h.t).toLocaleDateString("es-PE",{day:"numeric",month:"short"})} · ${fmt(h.ms)}</div></div><b style="font-family:var(--f-display);font-size:22px">${h.ok}/${h.n}</b></div>`).join("")}</div>`:'<div class="empty">Aún no hay sesiones.</div>'}</div>
   ${confirmReset?`<div class="card group"><span>Se borrarán tu avance, favoritas y sesiones en este dispositivo.</span><div class="row"><button class="btn sec" id="no">Cancelar</button><button class="btn" id="yes">Borrar todo</button></div></div>`:
   `<button class="btn sec" id="rs">Reiniciar progreso</button>`}
  </section>`;
  const rs=$("#rs");if(rs)rs.onclick=()=>{confirmReset=true;rProg()};
  const no=$("#no");if(no)no.onclick=()=>{confirmReset=false;rProg()};
  const yes=$("#yes");if(yes)yes.onclick=()=>{stats={};favs=[];hist=[];save("stats",stats);save("favs",favs);save("hist",hist);confirmReset=false;rProg()};
}
render();
try{if("serviceWorker"in navigator&&location.protocol.startsWith("http")&&!window.claude)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
</script>
</html>
